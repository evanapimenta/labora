services:
  labora-agendamento:
    build: .
    expose:
      - "8080"
    environment:
      - SERVICE_FQDN_AGENDAMENTO_8080
      - LABORA_API_URL=${LABORA_API_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
      - LABIFY_SSO_GOOGLE_CLIENT_ID=${LABIFY_SSO_GOOGLE_CLIENT_ID}
      - LABIFY_SSO_GOOGLE_CLIENT_SECRET=${LABIFY_SSO_GOOGLE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
